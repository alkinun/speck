name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.10"
          version: "0.12.1"
      - name: Install the locked CPU test environment
        run: make setup
      - name: Format, lint and test
        run: make quality
      - name: Check the plan, records and document links
        run: make plan-check
      - name: Exercise the CPU workflow
        run: make smoke
