name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          python-version: "3.10"
          version: "0.12.1"
      - name: Install the locked CPU test environment
        run: >-
          uv sync --extra cpu --group dev --group dataset-build --group ruler
          --group transformers --locked
      - name: Check formatting
        run: uv run --no-sync ruff format --check --config ruff-format.toml .
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Test
        run: uv run --no-sync pytest -q
      - name: Validate the research compendium
        run: uv run --no-sync python -m scripts.research_catalog
      - name: Verify the research archive
        run: uv run --no-sync python -m scripts.archive check
      - name: Check the source-evidence boundary
        env:
          SPECK_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base="${SPECK_DIFF_BASE:-HEAD^}"
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=HEAD
          fi
          uv run --no-sync python -m scripts.source_pin_check --base "$base"
      - name: Check frozen research evidence
        run: uv run --no-sync pytest -q --evidence -m evidence
      - name: Exercise the CPU workflow
        run: uv run --no-sync python -m scripts.smoke
