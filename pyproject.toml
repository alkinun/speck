[project]
name = "speck"
version = "0.1.0"
description = "A compact research harness for language model data and training"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pyarrow>=21.0.0",
    "py3langid==0.3.0",
    "huggingface-hub>=0.34.0",
    "safetensors>=0.6.2",
    "sentencepiece>=0.2.0",
    "torch==2.9.1",
    "wandb>=0.21.3",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["speck*", "scripts*"]
namespaces = false

[dependency-groups]
dataset-build = [
    "datasketch==2.0.0",
    "datasets==5.0.1",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.0",
]
open-slm = [
    "lm-eval[hf] @ git+https://github.com/EleutherAI/lm-evaluation-harness.git@64f3d0924fc695efd6d776a5ac91f97138085516",
    { include-group = "transformers" },
]
capability = [
    { include-group = "open-slm" },
    "evalplus @ git+https://github.com/evalplus/evalplus.git@26d6d00bb1fd0fa37f39c99d5290da67891d1c5e",
    "langdetect==1.0.9",
    "immutabledict==4.3.1",
]

transformers = [
    "transformers==5.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "evidence: verify frozen research records against their original checkout",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

# Select PyTorch builds for CUDA 12.8 or CPU.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.optional-dependencies]
cpu = [
    "torch==2.9.1",
]
gpu = [
    "liger-kernel==0.8.2",
    "torch==2.9.1",
]
linear = [
    "flash-linear-attention==0.5.0",
]

[tool.uv]
default-groups = []
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]
