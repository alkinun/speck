[project]
name = "speck"
version = "0.1.0"
description = "A compact research harness for pretraining small language models"
readme = "readme.md"
license = { file = "license" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "pyarrow>=21.0.0",
    "py3langid==0.3.0",
    "huggingface-hub>=0.34.0",
    "requests>=2.32.0",
    "safetensors>=0.6.2",
    "sentencepiece>=0.2.0",
    "torch==2.9.1",
    "wandb>=0.21.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.15.0",
]
open-slm = [
    "lm-eval[hf] @ git+https://github.com/EleutherAI/lm-evaluation-harness.git@64f3d0924fc695efd6d776a5ac91f97138085516",
    "transformers==5.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["wandb"]

# Target PyTorch to CUDA 12.8 or CPU.
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.optional-dependencies]
cpu = [
    "torch==2.9.1",
]
gpu = [
    "torch==2.9.1",
]

[tool.uv]
default-groups = []
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]
